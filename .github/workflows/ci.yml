name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm target)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt clippy
          rustup target add wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Test (native)
        run: cargo test --workspace

      # The wasm bundle is built from the lib only; verify it type-checks for the
      # browser target too (server-only modules are cfg-excluded there).
      - name: Check wasm target
        run: cargo check -p ui --lib --target wasm32-unknown-unknown --features web
