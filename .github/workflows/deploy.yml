name: Deploy

# Build the image, push it to GitHub Container Registry (ghcr.io), and roll it
# out to the Container App on every push to main (and on demand). Azure auth is
# passwordless via OIDC; GHCR auth uses the built-in GITHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for azure/login OIDC
  contents: read
  packages: write # required to push to ghcr.io

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/<owner>/<repo>/portfolio (owner/repo are already lowercase)
  IMAGE: ghcr.io/${{ github.repository }}/portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the Dockerfile on the runner and pushes to GHCR. Tagged with the
      # commit SHA (immutable) and latest.
      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out to Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}"
