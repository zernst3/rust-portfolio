[package]
name = "portfolio_scene"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# cdylib so wasm-bindgen-cli can produce a JS-loadable WASM module.
# rlib so other workspace crates (or tests) could pull in helpers.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
bevy = { workspace = true }
wasm-bindgen = { workspace = true }

# Force getrandom 0.3 and 0.4 to compile with wasm_js backend for wasm32-unknown-unknown.
# Cargo feature-unification propagates wasm_js to all transitive users (ahash→bevy_utils, uuid).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
