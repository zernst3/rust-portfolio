[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# web feature enables dioxus/web for the WASM hydration bundle.
# server-only deps live in [target.'cfg(not(target_arch="wasm32"))'.dependencies]
# so Cargo excludes them for wasm32 automatically — no dx feature-flag magic needed.
# Per PORT-FULLSTACK-1.
[features]
default = []
web = ["dioxus/web"]

[lib]
name = "ui"
path = "src/lib.rs"

[[bin]]
name = "portfolio"
path = "src/main.rs"

# Integration tests use build_router() which is server-only code; since they
# run on native (not wasm32), the server deps are available automatically via
# [target.cfg] below — no required-features needed.
[[test]]
name = "contact"
path = "tests/contact.rs"

[dependencies]
# Always compiled (both native and wasm32)
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# thiserror compiles for wasm32 harmlessly; used by dto.rs + mailgun.rs
thiserror = { workspace = true }

# Browser-only deps for the Rust/WebGL water-cinemagraph background (web-sys).
# wasm32-only; native/server builds don't pull these. Versions pinned to the
# wasm-bindgen already in the graph (via dioxus-web) so there's one shared ABI.
# The GLSL shader source + auto-generated wasm-bindgen glue are the only non-Rust
# artifacts here (both irreducible on the web).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.122"
js-sys = "0.3.99"
web-sys = { version = "0.3.99", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
    "HtmlImageElement", "EventTarget", "CssStyleDeclaration", "MediaQueryList",
    "WebGlRenderingContext", "WebGlProgram", "WebGlShader", "WebGlUniformLocation",
    "WebGlBuffer", "WebGlTexture",
] }

# Server-only deps — Cargo excludes these for wasm32 automatically.
# No dx @server/--features magic required; the target cfg handles it.
# `dioxus = { features = ["server"] }` merged here to add the server feature
# only on native (dioxus/server pulls in mio/tokio which break wasm32 builds).
# Per PORT-FULLSTACK-1.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { workspace = true, features = ["server"] }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
# Reads IP + PORT env vars that `dx serve` injects so the server binary binds
# the port dx expects rather than a hardcoded 3000. Without this, dx proxies to
# a different port and gets ECONNREFUSED ("Backend not ready after 30s").
dioxus-cli-config = { workspace = true }
